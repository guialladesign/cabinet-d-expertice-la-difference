<head>
<meta charset="UTF-8">

<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= NAVBAR (simplifiée) ================= -->

      </ul>

<!-- ================= SECTION COMPTE ================= -->
<section class="ld-section ld-auth-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-xl-5">

        <p class="ld-eyebrow text-center">Espace participant</p>
        <h1 class="ld-h2 text-center">Accédez à votre espace</h1>
        <p class="ld-lead text-center mb-4">
          Connectez-vous pour retrouver vos formations et vos attestations,
          ou créez votre compte en quelques secondes.
        </p>

        <div class="ld-auth-card">
          <div class="ld-auth-tabs">
            <button class="ld-auth-tab active" data-tab="login" type="button">Se connecter</button>
            <button class="ld-auth-tab" data-tab="signup" type="button">Créer un compte</button>
          </div>

          <p class="ld-auth-context" id="authContext" hidden>
            <i class="fa-solid fa-circle-info"></i>
            Connectez-vous ou créez un compte pour finaliser votre inscription à la formation
            <strong id="authContextFormation"></strong>.
          </p>

          <!-- ---------- Connexion ---------- -->
          <form class="ld-auth-form" id="loginForm">
            <div class="mb-3">
              <label class="form-label" for="loginEmail">Email</label>
              <input type="email" class="form-control ld-input" id="loginEmail" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="loginPassword">Mot de passe</label>
              <input type="password" class="form-control ld-input" id="loginPassword" required minlength="6">
            </div>
            <button type="submit" class="btn ld-btn-primary btn-lg w-100">Se connecter</button>
            <p class="ld-auth-feedback" id="loginFeedback" role="status" aria-live="polite"></p>
          </form>

          <!-- ---------- Création de compte ---------- -->
          <form class="ld-auth-form" id="signupForm" hidden>
            <div class="mb-3">
              <label class="form-label" for="signupNom">Nom complet</label>
              <input type="text" class="form-control ld-input" id="signupNom" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Téléphone</label>
              <div class="d-flex gap-2">
                <select class="form-select ld-input" id="signupIndicatif" style="max-width:135px;">
                  <option value="+226" selected>🇧🇫 +226</option>
                  <option value="+225">🇨🇮 +225</option>
                  <option value="+223">🇲🇱 +223</option>
                  <option value="+227">🇳🇪 +227</option>
                  <option value="+228">🇹🇬 +228</option>
                  <option value="+229">🇧🇯 +229</option>
                  <option value="+221">🇸🇳 +221</option>
                  <option value="+233">🇬🇭 +233</option>
                  <option value="+234">🇳🇬 +234</option>
                  <option value="+33">🇫🇷 +33</option>
                  <option value="+1">🇺🇸/🇨🇦 +1</option>
                  <option value="autre">Autre…</option>
                </select>
                <input type="tel" class="form-control ld-input" id="signupTelephone" placeholder="70 12 34 56" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="signupEmail">Email</label>
              <input type="email" class="form-control ld-input" id="signupEmail" required>
            </div>
            <div class="row g-2">
              <div class="col-md-4">
                <label class="form-label" for="signupVille">Ville</label>
                <input type="text" class="form-control ld-input" id="signupVille">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="signupPays">Pays</label>
                <input type="text" class="form-control ld-input" id="signupPays" value="Burkina Faso">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="signupStructure">Structure</label>
                <input type="text" class="form-control ld-input" id="signupStructure" placeholder="Employeur, ONG...">
              </div>
            </div>
            <div class="mb-3 mt-3">
              <label class="form-label" for="signupPassword">Mot de passe (6 caractères min.)</label>
              <input type="password" class="form-control ld-input" id="signupPassword" required minlength="6">
            </div>
            <button type="submit" class="btn ld-btn-primary btn-lg w-100">Créer mon compte</button>
            <p class="ld-auth-feedback" id="signupFeedback" role="status" aria-live="polite"></p>
          </form>
        </div>

      </div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="auth.js"></script>
</body>
</html>
